<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 54px Inter, Arial, Helvetica, sans-serif; fill: #0F172A; letter-spacing: 0.08em; }
      .subtitle { font: 400 20px Inter, Arial, Helvetica, sans-serif; fill: #334155; }
      .box-title { font: 700 18px Inter, Arial, Helvetica, sans-serif; fill: #0F172A; letter-spacing: 0.03em; }
      .box-text { font: 400 16px Inter, Arial, Helvetica, sans-serif; fill: #475569; }
      .small { font: 400 14px Inter, Arial, Helvetica, sans-serif; fill: #64748B; }
      .metric-label { font: 600 15px Inter, Arial, Helvetica, sans-serif; fill: #1D4ED8; letter-spacing: 0.04em; }
      .metric-value { font: 700 26px Inter, Arial, Helvetica, sans-serif; fill: #0F172A; }
      .metric-note { font: 400 14px Inter, Arial, Helvetica, sans-serif; fill: #475569; }
      .blue { fill: #1D4ED8; }
